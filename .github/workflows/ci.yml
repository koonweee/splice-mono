name: CI
run-name: CI ${{ github.event.inputs.request_id || github.head_ref || github.ref_name }}

on:
  pull_request:
    branches: [main, deploy]
  workflow_dispatch:
    inputs:
      base:
        description: Base branch to compare against
        required: true
        default: deploy
      head:
        description: Head branch to validate
        required: true
        default: main
      request_id:
        description: Unique caller id for deploy workflow correlation
        required: false
        default: manual

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get changed files
        env:
          BASE_BRANCH: ${{ github.event.inputs.base || github.base_ref }}
          HEAD_BRANCH: ${{ github.event.inputs.head || github.head_ref }}
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch origin "$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" "$HEAD_BRANCH:refs/remotes/origin/$HEAD_BRANCH"
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_BRANCH...origin/$HEAD_BRANCH")
          else
            # For PRs, GitHub merges the PR branch, so HEAD~1 is the base.
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if backend runtime, tests, or quality gates changed
          if echo "$CHANGED_FILES" | grep -Eq "^backend/(src|test|package.json|yarn.lock|eslint.config.mjs|tsconfig.*\\.json)"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

          # Check if frontend runtime, tests, generated-client config, or quality gates changed
          if echo "$CHANGED_FILES" | grep -Eq "^frontend/(src|package.json|yarn.lock|eslint.config.js|tsconfig.json|vite.config.ts|orval.config.ts)"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  backend-lint:
    name: Backend Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: backend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  backend-typecheck:
    name: Backend Typecheck
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: backend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck

  frontend-typecheck:
    name: Frontend Typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck

  frontend-lint:
    name: Frontend Lint
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn lint
