name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to merge main into deploy
        required: true
        default: deploy

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to production
    if: ${{ inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Deploy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main deploy:refs/remotes/origin/deploy

          COMMITS=$(git log origin/deploy..origin/main --oneline)
          if [ -z "$COMMITS" ]; then
            echo "No new commits to deploy. deploy is up to date with main."
            exit 0
          fi

          echo "Commits to deploy:"
          echo "$COMMITS"

          COMMIT_COUNT=$(echo "$COMMITS" | wc -l | xargs)
          REPO_URL=$(gh repo view --json url --jq '.url')
          SUMMARY=$(git log origin/deploy..origin/main --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))")
          PR_TITLE="Deploy: $COMMIT_COUNT commit(s) to production"
          PR_BODY=$(printf '## Changes\n%s' "$SUMMARY")

          PR_URL=$(gh pr list --base deploy --head main --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base deploy \
              --head main \
              --title "$PR_TITLE" \
              --body "$PR_BODY")
          else
            echo "Found existing deploy PR: $PR_URL"
            gh pr edit "$PR_URL" --title "$PR_TITLE" --body "$PR_BODY"
          fi

          CI_REQUEST_ID="deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "Triggering CI for main -> deploy..."
          gh workflow run ci.yml --ref main -f base=deploy -f head=main -f request_id="$CI_REQUEST_ID"

          echo "Waiting for CI run to start..."
          CI_RUN_ID=""
          for i in {1..30}; do
            CI_RUN_ID=$(gh run list \
              --workflow ci.yml \
              --event workflow_dispatch \
              --branch main \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"CI $CI_REQUEST_ID\") | .databaseId" \
              | head -n 1)

            if [ -n "$CI_RUN_ID" ]; then
              echo "CI run started: $CI_RUN_ID"
              break
            fi

            sleep 2
          done

          if [ -z "$CI_RUN_ID" ]; then
            echo "::error::Timed out waiting for the dispatched CI run to start."
            exit 1
          fi

          gh run watch "$CI_RUN_ID" --compact --exit-status

          CI_HEAD_SHA=$(gh run view "$CI_RUN_ID" --json headSha --jq '.headSha')
          PR_HEAD_SHA=$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')

          if [ "$PR_HEAD_SHA" != "$CI_HEAD_SHA" ]; then
            echo "::error::main moved while deploy CI was running. Re-run deploy so the latest main SHA is validated before merging."
            echo "Validated SHA: $CI_HEAD_SHA"
            echo "Current PR head SHA: $PR_HEAD_SHA"
            exit 1
          fi

          if ! gh pr merge --merge --match-head-commit "$CI_HEAD_SHA" "$PR_URL"; then
            echo "::error::Could not merge the deploy PR. Check deploy branch protection and repository Actions workflow permissions."
            exit 1
          fi

          echo "Deploy PR merged: $PR_URL"
